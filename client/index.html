<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apple Ahmad — genuine iPhones, iPads, MacBooks, Apple Watch, AirPods and accessories in Pakistan. Cash on Delivery available." />
    <title>Apple Ahmad — iPhone, iPad, MacBook, Watch & AirPods</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme/accent before React paints, so there is no dark flash in light mode.
      try {
        var t = localStorage.getItem('aa-theme') === 'light' ? 'light' : 'dark';
        var a = localStorage.getItem('aa-accent') || '#007aff';
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.setProperty('--accent', a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
